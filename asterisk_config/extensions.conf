[general]
static=yes
writeprotect=no

[from-internal]
; ⛔ [절대 지우지 마시오] 999 전화를 받으면 ivr-main으로 이동
exten => 999,1,NoOp(Static IVR Start)
exten => 999,n,Set(CALLERID(num)=01032043901)
exten => 999,n,Set(CALLERID(name)=01032043901)
exten => 999,n,Answer()
exten => 999,n,Goto(ivr-main,s,1)

; 일반 내선 통화
exten => _1XX,1,Dial(SIP/${EXTEN},30)
exten => _1XX,n,Hangup()

[ivr-main]
exten => s,1,Answer()
exten => s,n,Background(/var/lib/asterisk/sounds/custom/01_welcome)
exten => s,n,Background(/var/lib/asterisk/sounds/custom/02_select_menu)
exten => s,n,WaitExten(10)

; ⛔ [절대 지우지 마시오] 부서 선택 (1:영업, 2:지원, 3:경영)
exten => 1,1,NoOp(Option 1 Selected)
exten => 1,n,Queue(sales_group,r)

exten => 2,1,NoOp(Option 2 Selected)
exten => 2,n,Queue(support_group,r)

exten => 3,1,NoOp(Option 3 Selected)
exten => 3,n,Queue(management_group,r)

; ⛔ [절대 지우지 마시오] 콜백 서비스 (4번)
exten => 4,1,NoOp(Option 4 Selected)
exten => 4,n,Playback(auth-thankyou)
exten => 4,n,Playback(beep)
exten => 4,n,System(curl -X POST http://backend:8080/api/crm/inbound/log-callback -H 'Content-Type: application/json' -d '{"interaction_id":"${UNIQUEID}","keyword":"${CALLERID(num)}","media_type":"call","cmpycd":"COIT"}')
exten => 4,n,Hangup()

[cti-answer-force]
exten => s,1,NoOp(Standard CTI Answer with Stereo Recording)
exten => s,n,Answer()
exten => s,n,Set(REC_DIR=${STRFTIME(${EPOCH},,%Y%m)})
exten => s,n,System(mkdir -p /var/spool/asterisk/monitor/${REC_DIR})
exten => s,n,MixMonitor(${REC_DIR}/${UNIQUEID}.wav,S)
exten => s,n,SIPAddHeader(Call-Info:\;answer-after=0)
exten => s,n,Dial(SIP/${AGENT_EXTEN},15,tT)
exten => s,n,Hangup()

[outbound-call]
exten => _X.,1,NoOp(Outbound Call for ${EXTEN})
exten => _X.,n,Set(DEST_NUM=${EXTEN})
exten => _X.,n,ExecIf($["${DEST_NUM}" = "01032043901"]?Set(DEST_NUM=103))
exten => _X.,n,Answer()
exten => _X.,n,Set(REC_DIR=${STRFTIME(${EPOCH},,%Y%m)})
exten => _X.,n,System(mkdir -p /var/spool/asterisk/monitor/${REC_DIR})
exten => _X.,n,MixMonitor(${REC_DIR}/${REC_FILE}.wav,S)
exten => _X.,n,Dial(SIP/${DEST_NUM},30,tT)
exten => _X.,n,Hangup()

exten => i,1,Playback(invalid)
exten => i,n,Goto(ivr-main,s,1)
exten => t,1,Hangup()
