server {
    listen 80;
    server_name localhost;

    # 🚀 [해결 핵심 1] 브라우저가 화면 상자를 그리게 만드는 MIME 타입 표준 설정
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    root /usr/share/nginx/html;
    index index.html;

    # 🚀 1. 로그인 화면 및 자원 배달 (빈 화면 해결)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 🚀 2. 웹소켓 전용 프록시 (CTI 팝업용)
    location /api/ws/ {
        proxy_pass http://backend:8080/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 🚀 3. 일반 API 요청 배달
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 🚀 4. 소리 재생 인코딩 세탁 (소리 재생 해결)
    location /api/crm/inbound/play-recording {
        proxy_pass http://backend:8080/api/crm/inbound/play-recording;
        proxy_hide_header Content-Type;
        add_header Content-Type audio/wav;
        proxy_set_header Host $host;
    }

    # 🚀 5. ARS 음원 직접 배달 (HGPA040U 전용 지름길)
    location /sounds/ {
        alias /var/lib/asterisk/sounds/custom/;
        add_header Content-Type audio/wav;
        autoindex on;
    }
}
